name: Nutri Assistent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Toda segunda-feira as 8h

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short 2>&1 || echo "Tests completed with issues"

    - name: Run linting (basic)
      run: |
        python -m py_compile gui/run.py
        python -m py_compile gui/app.py
        python -m py_compile automation/orchestrator.py
        python -m py_compile storage/db.py
        python -m py_compile nutrition/matcher.py
      continue-on-error: true

  build:
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Generate icon
      run: python generate_icon.py
      continue-on-error: true

    - name: Build executable
      run: |
        pyinstaller `
          --name "NutriAssistent" `
          --windowed `
          --onefile `
          --icon "extra/icon.ico" `
          --add-data "extra/icon.ico;extra" `
          --hidden-import "customtkinter" `
          --hidden-import "playwright" `
          --hidden-import "rapidfuzz" `
          --hidden-import "httpx" `
          --hidden-import "bs4" `
          --collect-all "customtkinter" `
          --noconfirm `
          gui/run.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NutriAssistent-${{ github.sha }}
        path: dist/NutriAssistent.exe
        retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    
    permissions:
      contents: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: NutriAssistent-${{ github.sha }}

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: NutriAssistent.exe
        generate_release_notes: true
        draft: false
        prerelease: false
